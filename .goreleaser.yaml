# goreleaser owns the binary release, the way .warden.yaml owns the checks.
# Kiln invokes this on a proven commit; it does not reimplement any of it.
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - id: kiln
    main: ./cmd/kiln
    binary: kiln
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X go.klarlabs.de/kiln/internal/version.Version={{.Version}}
      - -X go.klarlabs.de/kiln/internal/version.Commit={{.ShortCommit}}
      - -X go.klarlabs.de/kiln/internal/version.Date={{.Date}}
    goos: [linux, darwin]
    goarch: [amd64, arm64]

  - id: kilnd
    main: ./cmd/kilnd
    binary: kilnd
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags:
      - -s -w
      - -X go.klarlabs.de/kiln/internal/version.Version={{.Version}}
      - -X go.klarlabs.de/kiln/internal/version.Commit={{.ShortCommit}}
      - -X go.klarlabs.de/kiln/internal/version.Date={{.Date}}
    goos: [linux, darwin]
    goarch: [amd64, arm64]

archives:
  - formats: [tar.gz]
    name_template: "kiln_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    ids: [kiln, kilnd]
    files:
      - README.md
      - LICENSE
      - docs/*.md
      - examples/*.yaml

checksum:
  name_template: checksums.txt
  algorithm: sha256

# Kiln refuses to publish a release whose config has no signs: block, so this
# is not optional decoration — it is what makes the release publishable at all.
#
# Keyless cosign (Fulcio certificate + Rekor transparency log) over the
# checksum manifest. One signature covers every archive, because the manifest
# names them all by digest.
#
# --bundle, not --output-signature/--output-certificate: cosign 3 deprecated
# the split flags and refuses the new bundle format without it. The bundle is
# one file carrying the signature, the certificate and the Rekor inclusion
# proof, which is also one fewer asset for a verifier to fetch.
signs:
  - cmd: cosign
    signature: "${artifact}.bundle"
    args:
      - sign-blob
      - "--yes"
      - "--new-bundle-format"
      - "--bundle=${signature}"
      - "${artifact}"
    artifacts: checksum

# An SBOM per archive, in CycloneDX. Kiln's whole argument is that an artifact
# should arrive describing itself rather than requiring trust in the pipeline
# that made it; shipping releases without one would be arguing it for other
# people's artifacts and not our own.
sboms:
  - id: archive-sbom
    artifacts: archive
    documents: ["${artifact}.sbom.cdx.json"]
    cmd: syft
    args: ["$artifact", "--output", "cyclonedx-json=$document"]

# macOS install path. A cask rather than a formula because goreleaser
# deprecated `brews`, and casks are macOS-only — Linux gets `go install` or the
# tarball, both documented in the README.
#
# The quarantine hook is not optional: without it macOS refuses a downloaded
# unsigned binary with "damaged and cannot be opened", which reads as a
# corrupted release rather than Gatekeeper doing its job.
homebrew_casks:
  - name: kiln
    binaries: [kiln, kilnd]
    repository:
      owner: klarlabs-studio
      name: homebrew-tap
      # The release job's own GITHUB_TOKEN cannot write to another repository,
      # so the tap needs its own.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/klarlabs-studio/kiln"
    description: "Signed-artifact factory: prove a commit, build it, sign it, attest it"
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/kiln"]
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/kilnd"]
          end

changelog:
  use: git
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]

release:
  github:
    owner: klarlabs-studio
    name: kiln
  draft: false
  prerelease: auto
