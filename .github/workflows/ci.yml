# Thin caller for the shared klarlabs-studio Go CI bar.
#
# Yes, Kiln is a CI replacement and this is a GitHub Actions workflow. Kiln
# cannot bootstrap itself: the compute that proves Kiln has to come from
# somewhere, and until a Kiln box is watching this repository, that somewhere
# is Actions. The Glossa API is the success test (see
# examples/pipeline.example.yaml) — not this file.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  pull_request:
    branches: [main]
    # No paths-ignore on PRs: the required checks are branch-protection gates,
    # so a docs-only PR that skipped them would never become mergeable.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    # Pinned to a commit, not @main. The shared bar decides what "passing"
    # means for this repository, so leaving it floating means anyone who can
    # push to another repository can change this one's gate. Dependabot bumps
    # it, which makes each change a reviewable diff instead of a silent one.
    uses: klarlabs-studio/.github/.github/workflows/go-ci.yml@4b0f34c9c8efdfe6bb4aa9854e569f894f896118 # main, 2026-08-10
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    secrets: inherit
    with:
      # No .coverctl.yaml threshold yet.
      coverage: false

  examples:
    name: Examples
    runs-on: ubuntu-latest
    # A bound, because the default is six hours. Nothing here legitimately
    # takes ten minutes, and a job that hangs on a network read otherwise burns
    # a runner until somebody notices.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # From go.mod, like the shared bar does — a hardcoded version here
          # would silently drift the day the module's minimum moves.
          go-version-file: go.mod
          cache: true
      # A pipeline in the docs that no longer parses is worse than no example.
      # --config-only keeps this honest without installing docker, cosign and
      # nox on a linter runner.
      # Two kinds of example, two validators. A pipeline in the docs that no
      # longer parses is worse than no example — and so is a verification
      # policy, which is the file a *consumer* copies.
      - name: Validate shipped examples
        run: |
          go build -o bin/kiln ./cmd/kiln
          for f in examples/*policy*.yaml; do
            echo "== $f (policy)"
            ./bin/kiln doctor --policy "$f"
          done
          for f in examples/pipeline*.yaml .kiln.yaml; do
            echo "== $f (pipeline)"
            ./bin/kiln doctor --config-only --pipeline "$f"
          done

  verify-e2e:
    name: Verify (real cosign)
    runs-on: ubuntu-latest
    # Every unit test of the verify path scripts cosign with a fake, which
    # proves "given cosign says X, kiln concludes Y" and cannot prove "cosign,
    # run with kiln's arguments, says X". This job is the second half, and it
    # found a defect the first time it ran: a refusal rendered as
    # "FAIL signature 0 < 1", explanation discarded.
    #
    # It runs here rather than behind an opt-in env var on purpose. A test
    # nobody runs is worse than no test, because it reads as coverage.
    timeout-minutes: 10
    permissions:
      contents: read
    services:
      # The script starts its own registry when run by hand; in CI a service
      # container is more reliable than docker-in-docker timing.
      registry:
        image: registry:2
        ports:
          - 5555:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: kiln verify against real cosign
        env:
          # The service container above already holds the port, so the script
          # must not try to start a second registry.
          KILN_E2E_REGISTRY_RUNNING: "1"
        run: ./scripts/e2e-verify.sh
