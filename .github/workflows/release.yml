# Tag-driven release.
#
# The whole job is: prove the tag, then hand the mechanics to GoReleaser.
# Kiln does not reimplement releasing any more than it reimplements checks —
# `.goreleaser.yaml` owns the archives, the checksum manifest, the cosign
# signature, the SBOMs and the Homebrew cask.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

# A tag must produce exactly one release run. Two racing runs upload the same
# asset names, and both fail with 422 already_exists — after the GitHub Release
# already exists, which is the expensive half to undo.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  # Keyless cosign. Fulcio issues a short-lived certificate against this
  # workflow's OIDC identity, which is what makes the signature traceable to
  # this repository and this tag rather than to a key somebody holds.
  #
  # Granted at the workflow level, so every job gets it unless it says
  # otherwise — which is why `test` below says otherwise. See its comment.
  id-token: write

jobs:
  # The tag's own commit, tested in the environment CI tests in.
  #
  # A separate job for one reason: permissions. This workflow grants
  # id-token: write so cosign can sign keylessly, and that sets
  # ACTIONS_ID_TOKEN_REQUEST_URL for every step in the job. CI has no such
  # permission and no such variable, so a test that reads the ambient
  # environment — "is there an OIDC identity?" — passed everywhere a developer
  # or a pull request would ever look, and failed only once a tag was pushed.
  #
  # That is the worst possible moment to find out, and it cost two tags:
  # v0.3.0 and v0.3.1 are tagged with no release attached. Overriding
  # permissions here makes this job's environment the same one CI runs, so a
  # test that passes on main passes here.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # CI already ran on the commit this tag points at. Running the suite
      # again is not redundancy for its own sake: a tag can be moved, and this
      # is the last point before artifacts exist that anyone will trust.
      - run: go test -race ./...

  release:
    needs: test
    runs-on: ubuntu-latest
    # Generous next to CI's ten minutes: this cross-compiles four archives and
    # catalogues an SBOM for each. Still a bound, because a release wedged on a
    # registry read is worse than a release that failed.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser builds the changelog from history; a shallow clone gives
          # it one commit and a changelog to match.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # From go.mod, like CI does. A hardcoded version here would drift the
          # day the module's minimum moves, and a release built on a toolchain
          # the tests never ran on is not the thing that was tested.
          go-version-file: go.mod

      # cosign is named explicitly rather than left to the action's default.
      # The default moved from v2 to v3 between installer releases, and v3
      # rejects the flags v2 accepted — so which cosign a release used is a
      # fact worth reading off this file rather than inferring from a SHA.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.0.6

      - name: Install syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          # Exact, not "~> v2". A release is the one artifact that must be
          # reproducible from what this file says; a range means the tool that
          # built v0.1.0 and the tool that builds v0.2.0 may differ without a
          # commit recording it.
          version: "2.16.0"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The cask lands in klarlabs-studio/homebrew-tap, which the repo's
          # own GITHUB_TOKEN cannot write to.
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      # A release nobody can verify would make the argument for verification
      # in a project that had not taken it. This checks the published bundle
      # the way a stranger would: against the tag's identity, not a key we
      # hold.
      - name: Verify the release signs what it claims
        run: |
          set -euo pipefail
          gh release download "${GITHUB_REF_NAME}" --pattern 'checksums.txt*' --dir verify
          cosign verify-blob \
            --bundle verify/checksums.txt.bundle \
            --certificate-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            verify/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
