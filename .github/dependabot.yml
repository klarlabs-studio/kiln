# Pins only stay honest if something bumps them.
#
# Every action in this repository is pinned to a commit SHA, which stops a tag
# being moved under us — and, left alone, also stops security fixes arriving.
# Dependabot turns each bump into a reviewable diff, which is the whole point
# of pinning rather than an argument against it.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      # One PR for the routine patch traffic; anything major arrives on its own
      # so it gets read rather than waved through in a batch of nine.
      minor-and-patch:
        update-types: [minor, patch]
